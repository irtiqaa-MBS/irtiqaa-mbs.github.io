<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ارتقاء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@600&display=swap">
<style>
/* Layout: one centered column, logo plate on top, four gold-framed account rows */
:root{
  --green:#0c3a2a; --green-deep:#082a1e; --gold:#c9a063; --gold-soft:rgba(201,160,99,.55);
  --ink:#f3ecdd; --plate:#ffffff;
  --ar:"Readex Pro",Tahoma,"Segoe UI",sans-serif; --latin:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{margin:0}
body{
  background:radial-gradient(120% 70% at 50% 0%, #11533b 0%, var(--green) 45%, var(--green-deep) 100%) fixed, var(--green-deep);
  color:var(--ink); font-family:var(--ar);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:32px 40px;
}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.plate{background:var(--plate);border-radius:22px;padding:22px 20px;border:1px solid var(--gold-soft);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.plate img{display:block;width:100%;height:auto}
.intro{text-align:center;display:flex;flex-direction:column;gap:6px}
.intro h1{margin:0;font-size:1.15rem;font-weight:600;text-wrap:balance}
.intro p{margin:0;font-size:.9rem;color:var(--gold)}
nav{display:flex;flex-direction:column;gap:14px}
a.row{
  display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:14px;
  padding:12px 14px;border:1px solid var(--gold-soft);border-radius:18px;
  text-decoration:none;color:var(--ink);background:rgba(255,255,255,.02);
  transition:background .2s,border-color .2s,transform .2s;
}
a.row:hover,a.row:focus-visible{background:rgba(201,160,99,.1);border-color:var(--gold);transform:translateY(-1px)}
a.row:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ic{width:52px;height:52px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center}
.ic svg{width:26px;height:26px;fill:var(--ink)}
.name{font-size:1rem;font-weight:500}
.handle{font-family:var(--latin);font-size:1.05rem;direction:ltr;color:var(--ink);opacity:.9;padding-inline-start:14px;border-inline-start:1px solid var(--gold-soft)}
.chev{width:16px;height:16px;fill:none;stroke:var(--gold);stroke-width:2}
footer{text-align:center;font-size:.75rem;color:var(--gold);opacity:.8}
@media (max-width:360px){.handle{font-size:.95rem;padding-inline-start:10px}.ic{width:44px;height:44px}}
@media (prefers-reduced-motion:reduce){a.row{transition:none}a.row:hover{transform:none}}
</style>
</head>
